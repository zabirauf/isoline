name: ci
on: [push, pull_request]
jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - uses: Swatinem/rust-cache@v2
      - name: Linux webview dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: Placeholder UI build (the Tauri crate embeds app/ui/dist at compile time)
        shell: bash
        run: mkdir -p app/ui/dist && [ -f app/ui/dist/index.html ] || echo '<!doctype html><title>Isoline</title>' > app/ui/dist/index.html
      - name: Sidecar binary (the Tauri build script checks that externalBin exists)
        shell: bash
        run: sh sidecar/copilot/build.sh --mock-only
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - name: Regression guard (eval on the repo itself, time-boxed)
        if: runner.os == 'Linux'
        run: timeout 300 cargo run --release -p iso-cli -- bench -r . --opens 50 --edits 10
  sidecar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - run: cd sidecar/copilot && go vet ./... && go test ./...
  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: cd app/ui && npm ci && npm run typecheck && npm test && npm run build
