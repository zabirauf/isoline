name: release

# Builds the desktop app and the iso-cli binary for macOS, Windows and Linux on arm64 and
# x64. A pushed tag `v*` publishes them as a GitHub release. A push to main refreshes the
# rolling `nightly` pre-release (stable file names, never marked Latest). A manual run only
# uploads workflow artifacts (or publishes, when given a tag).
on:
  push:
    tags: ["v*"]
    branches: [main]
    # Applies to branch pushes only; tag pushes always build.
    paths-ignore: ["**.md", "docs/**", "eval/**", "fixtures/**", "LICENSE"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish (leave empty to only build)"
        required: false
        default: ""

permissions:
  contents: write

# A newer push to main replaces a nightly build still in progress; tag builds always finish.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.ref == 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Both macOS builds run on the Intel pool: hosted Apple-silicon runners are often at
          # capacity and drop queued jobs after 15 minutes. arm64 is cross-compiled.
          - name: macos-arm64
            os: macos-15-intel
            target: aarch64-apple-darwin
            bundles: app
          - name: macos-x64
            os: macos-15-intel
            target: x86_64-apple-darwin
            bundles: app
          - name: windows-x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis,msi
          - name: windows-arm64
            os: windows-latest
            target: aarch64-pc-windows-msvc
            bundles: nsis
          - name: linux-x64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: deb,rpm,appimage
          - name: linux-arm64
            os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            bundles: deb,rpm,appimage
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache-dependency-path: sidecar/copilot/**/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}
      - name: Linux webview dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf rpm libfuse2 file
      - name: Install JavaScript dependencies
        shell: bash
        run: npm ci --prefix app && npm ci --prefix app/ui
      - name: Build the desktop app
        shell: bash
        working-directory: app
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
          NO_STRIP: "true"
        run: npx tauri build --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}
      - name: Build iso-cli
        shell: bash
        run: cargo build --release --locked -p iso-cli --target ${{ matrix.target }}
      - name: Collect release files
        shell: bash
        run: |
          set -euo pipefail
          version=$(sed -n 's/.*"version": "\([^"]*\)".*/\1/p' app/src-tauri/tauri.conf.json | head -1)
          rel=target/${{ matrix.target }}/release
          dist=dist && mkdir -p "$dist"
          case "${{ runner.os }}" in
            macOS)
              # Ad-hoc signs the bundle, then packs the DMG.
              sh app/scripts/make-dmg.sh ${{ matrix.target }}
              cp "$rel"/bundle/dmg/*.dmg "$dist/"
              # A zipped .app as well, for scripted installs (the Nix package uses it).
              ditto -c -k --keepParent "$rel/bundle/macos/Isoline.app" "$dist/Isoline_${version}_${{ matrix.name }}.app.zip"
              tar -C "$rel" -czf "$dist/iso-cli_${version}_${{ matrix.name }}.tar.gz" iso-cli
              ;;
            Windows)
              cp "$rel"/bundle/nsis/*.exe "$dist/"
              if [ -d "$rel/bundle/msi" ]; then cp "$rel"/bundle/msi/*.msi "$dist/"; fi
              (cd "$rel" && 7z a -tzip "$OLDPWD/$dist/iso-cli_${version}_${{ matrix.name }}.zip" iso-cli.exe >/dev/null)
              ;;
            Linux)
              cp "$rel"/bundle/deb/*.deb "$rel"/bundle/rpm/*.rpm "$rel"/bundle/appimage/*.AppImage "$dist/"
              tar -C "$rel" -czf "$dist/iso-cli_${version}_${{ matrix.name }}.tar.gz" iso-cli
              ;;
          esac
          ls -la "$dist"
      - uses: actions/upload-artifact@v4
        with:
          name: isoline-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || inputs.tag != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          notes=docs/release-notes.md
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --title "Isoline $TAG" --notes-file "$notes" --target "$GITHUB_SHA"
          fi

  nightly:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      # No checkout in this job, so gh needs the repo named.
      GH_REPO: ${{ github.repository }}
      TAG: nightly
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Stable file names
        run: |
          set -euo pipefail
          cd dist
          # Isoline_0.1.0_aarch64.dmg -> Isoline_nightly_aarch64.dmg, so links never change.
          for f in *; do
            n=$(echo "$f" | sed -E 's/[0-9]+\.[0-9]+\.[0-9]+/nightly/')
            [ "$f" = "$n" ] || mv "$f" "$n"
          done
          sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Move the nightly tag to this commit
        run: |
          set -euo pipefail
          if gh api "repos/$GITHUB_REPOSITORY/git/refs/tags/$TAG" >/dev/null 2>&1; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/$TAG" -f sha="$GITHUB_SHA" -F force=true >/dev/null
          else
            gh api -X POST "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$TAG" -f sha="$GITHUB_SHA" >/dev/null
          fi
      - name: Publish the nightly pre-release
        run: |
          set -euo pipefail
          short=${GITHUB_SHA:0:7}
          cat > notes.md <<NOTES
          Built from [\`$short\`](https://github.com/$GITHUB_REPOSITORY/commit/$GITHUB_SHA) on main, $(date -u '+%Y-%m-%d %H:%M UTC').
          Rebuilt on every push to main, so it can be broken. The stable build is the latest \`v*\` release.

          Update in place on macOS or Linux:

          \`\`\`sh
          curl -fsSL https://raw.githubusercontent.com/$GITHUB_REPOSITORY/main/scripts/install.sh | sh
          \`\`\`

          File names don't change between builds, so direct links keep working, for example
          https://github.com/$GITHUB_REPOSITORY/releases/download/nightly/Isoline_nightly_aarch64.dmg.
          The app still reports the version in tauri.conf.json; the commit above is what was built.
          NOTES
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --prerelease --title "Isoline nightly ($short)" --notes-file notes.md
            gh release upload "$TAG" dist/* --clobber
            # Drop files a past build had that this one doesn't.
            gh release view "$TAG" --json assets --jq '.assets[].name' | while read -r a; do
              [ -e "dist/$a" ] || gh release delete-asset "$TAG" "$a" --yes
            done
          else
            gh release create "$TAG" dist/* --prerelease --latest=false --title "Isoline nightly ($short)" --notes-file notes.md --verify-tag
          fi
