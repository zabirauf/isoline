[package]
name = "isoline"
description = "Isoline desktop app"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "isoline_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.5", features = [] }

[dependencies]
iso-core.workspace = true
iso-engine.workspace = true
iso-ai.workspace = true
tauri = { version = "2.12.6", features = [] }
tauri-plugin-dialog = "2.8.4"
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
dunce = "1.0.5"
parking_lot.workspace = true
tauri-plugin-opener = "2.7.3"
arboard = { version = "3.7.0", default-features = false }
portable-pty = "0.9.0"
