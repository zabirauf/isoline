[package]
name = "iso-resolve"
description = "Import resolution, one module per language."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
iso-core = { workspace = true, default-features = false }
oxc_resolver.workspace = true
serde.workspace = true
anyhow.workspace = true
serde_json.workspace = true
parking_lot.workspace = true
scip = "0.10.0"
protobuf = "3"
# canonicalize without the Windows verbatim prefix (\\?\C:\...), so paths compare with oxc results.
dunce = "1.0.5"

[dev-dependencies]
tempfile.workspace = true
